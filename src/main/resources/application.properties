spring.application.name=ms-security
spring.config.import=optional:file:.env[.properties]
spring.mongodb.uri=${MONGODB_URI}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
spring.mongodb.database = ms-security
server.port=5050

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:5050/api/public/oauth2/callback/google

# URL del Frontend (donde redirigir despues del login con OAuth)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}


