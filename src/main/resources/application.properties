# ============================================================================
# CONFIGURACIÓN PRINCIPAL DEL MICROSERVICIO DE SEGURIDAD (ms-security)
# ============================================================================

# Nombre de la aplicación
spring.application.name=ms-security

# Importación de variables de entorno desde archivo .env
# El archivo .env contiene credenciales sensibles y no se sube al repositorio
spring.config.import=optional:file:.env[.properties]

# ============================================================================
# CONFIGURACIÓN DE BASE DE DATOS MONGODB
# ============================================================================

# URI de conexión a MongoDB Atlas (definida en .env)
spring.mongodb.uri=${MONGODB_URI}

# Nivel de logging para consultas MongoDB (DEBUG para desarrollo)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Nombre de la base de datos
spring.mongodb.database = ms-security

# Puerto del servidor (diferente al default 8080 para evitar conflictos)
server.port=5050

# ============================================================================
# CONFIGURACIÓN DE JWT (JSON Web Tokens)
# ============================================================================

# Clave secreta para firmar los tokens (definida en .env)
jwt.secret=${JWT_SECRET}

# Tiempo de expiración del token en milisegundos (3600000 = 1 hora)
jwt.expiration=3600000

# ============================================================================
# CONFIGURACIÓN DE GOOGLE OAuth 2.0
# ============================================================================
# Proveedor: Google (incorporado en Spring Security)
# Console: https://console.cloud.google.com/

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:5050/api/public/oauth2/callback/google

# ============================================================================
# CONFIGURACIÓN DE GITHUB OAuth 2.0
# ============================================================================
# Proveedor: GitHub (incorporado en Spring Security)
# Console: https://github.com/settings/developers

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:5050/api/public/oauth2/callback/github

# ============================================================================
# CONFIGURACIÓN DE MICROSOFT OAuth 2.0
# ============================================================================
# Proveedor: Microsoft/Azure AD (requiere configuración manual del provider)
# Console: https://portal.azure.com/ > App registrations
#
# NOTA: Microsoft no es un proveedor incorporado en Spring Security,
# por lo que es necesario configurar manualmente los endpoints del provider.

spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.redirect-uri=http://localhost:5050/api/public/oauth2/callback/microsoft
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code

# Configuración del proveedor Microsoft (endpoints de Azure AD)
# El tenant "common" permite cuentas personales y empresariales
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# ============================================================================
# CONFIGURACIÓN DEL FRONTEND
# ============================================================================

# URL del frontend para redirecciones después del login OAuth
# Valor por defecto: http://localhost:4200 (Angular development server)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}


